name: Owner-approved initial region and egress contrast (read-only)

on:
  issue_comment:
  workflow_dispatch:
    inputs:
      approval:
        description: Owner approval for ONE initial public search page per runner (and optional third-party IP-country lookup)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daangn-initial-region-baseline-owner-approved
  cancel-in-progress: false

jobs:
  initial-region-contrast:
    # Never triggered by issues/PRs/pushes or comments from other accounts.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 11 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/run-daangn-region-baseline-v1') ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       inputs.approval == 'I_APPROVE_REGION_BASELINE_V1')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed Chrome Stable and Xvfb availability (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v google-chrome
          command -v xvfb-run
          echo 'GOOGLE_CHROME_STABLE_REQUIRED=YES'

      - name: Offline Chrome baseline fixture before site use (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python -m scripts.region_baseline_contrast --headed

      - name: One robots-checked public baseline and optional coarse egress class (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          xvfb-run -a python -m scripts.region_baseline_contrast \
            --live --headed --egress-context \
            --owner-approval I_APPROVE_REGION_BASELINE_V1

      - name: Check installed Chrome Stable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome -PathType Leaf)) {
            throw 'GOOGLE_CHROME_STABLE_MISSING'
          }

      - name: Offline Chrome baseline fixture before site use (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m scripts.region_baseline_contrast --headed
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_REGION_FIXTURE_FAILED' }

      - name: One robots-checked public baseline and optional coarse egress class (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m scripts.region_baseline_contrast --live --headed --egress-context --owner-approval I_APPROVE_REGION_BASELINE_V1
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_REGION_BASELINE_INCOMPLETE' }

      - name: Explicit research boundary
        if: always()
        shell: bash
        run: |
          echo 'One baseline-only public search page per runner, no region click, no listing visits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A separate opt-in third-party IP geolocation request returns only coarse country/network provider categories.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No IP, cookies, credentials, listing URLs, titles, raw headers, response bodies, HAR or profile exported.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Observations cannot approve listings, identify a cause, bypass REGION_MISMATCH, or trigger OCI imports.' >> "$GITHUB_STEP_SUMMARY"
