name: Owner-approved Chrome Stable public region input comparison

on:
  issue_comment:
  workflow_dispatch:
    inputs:
      approval:
        description: Exact one-shot public region diagnostics approval
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chrome-stable-input-diagnostic
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 11 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/run-daangn-chrome-input-compare-v1') ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       inputs.approval == 'I_APPROVE_CHROME_INPUT_COMPARISON_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed branded Chrome Stable and virtual display
        shell: bash
        run: |
          command -v google-chrome
          command -v xvfb-run
          echo "GOOGLE_CHROME_STABLE_PREINSTALLED=YES"
          echo "NO_CHROMIUM_DOWNLOAD_OR_STEALTH_FLAGS=YES"
      - name: Run offline real Chrome event fixture and two bounded public region checks
        shell: bash
        timeout-minutes: 8
        run: |
          xvfb-run -a python -m scripts.chrome_stable_input_compare \
            --live --headed \
            --owner-approval I_APPROVE_CHROME_INPUT_COMPARISON_V1
      - name: Record diagnostic limitation
        if: always()
        run: |
          echo 'Two user-approved public UI region comparisons at most; no listing details, raw input or web trace stored.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Results are diagnostic only. Owner-manual Chrome and CI Chrome differ in host, session and input provenance.' >> "$GITHUB_STEP_SUMMARY"
