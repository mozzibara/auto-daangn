name: Owner-approved time-zone-only region selection control

on:
  issue_comment:
  workflow_dispatch:
    inputs:
      approval:
        description: Exact owner approval for two timezone hypothesis arms per hosted OS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daangn-timezone-control-owner-approved
  cancel-in-progress: false

jobs:
  timezone-control:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 11 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/run-daangn-timezone-control-v1') ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       inputs.approval == 'I_APPROVE_TIMEZONE_REGION_CONTRAST_V1')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Configure Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Require installed Chrome Stable and Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v google-chrome
          command -v xvfb-run

      - name: Offline Chrome fixtures and timezone control (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          xvfb-run -a python -m scripts.region_timezone_contrast --headed

      - name: Bounded default-vs-Seoul timezone comparison (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 8
        run: |
          xvfb-run -a python -m scripts.region_timezone_contrast \
            --live --headed --egress-context \
            --owner-approval I_APPROVE_TIMEZONE_REGION_CONTRAST_V1

      - name: Require installed Chrome Stable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome -PathType Leaf)) {
            throw 'GOOGLE_CHROME_STABLE_MISSING'
          }

      - name: Offline Chrome fixtures and timezone control (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m scripts.region_timezone_contrast --headed
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_TIMEZONE_FIXTURE_FAILED' }

      - name: Bounded default-vs-Seoul timezone comparison (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          python -m scripts.region_timezone_contrast --live --headed --egress-context --owner-approval I_APPROVE_TIMEZONE_REGION_CONTRAST_V1
          if ($LASTEXITCODE -ne 0) { throw 'TIMEZONE_DIAGNOSTIC_INCOMPLETE' }

      - name: Diagnostic-only boundary
        if: always()
        shell: bash
        run: |
          echo 'Same runner: default browser context vs Asia/Seoul timezone only; two FILL-mode public region selections at most.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No IP rotation, proxy, authentication, listing visits, cookies/region text or private data exported.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Timezone result is correlational in a sequential test and cannot waive REGION_MISMATCH or authorize collection.' >> "$GITHUB_STEP_SUMMARY"
