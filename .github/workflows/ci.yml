name: Daangn offline regression CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Audit v4.26 canonical-only stock and transaction separation (offline)
        run: python -m scripts.audit_state_conversions_v425 --output v426_canonical_conversion_audit.json

      - name: Run offline regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -q 2>&1 | tee unittest.log

      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.os }}
          path: |
            unittest.log
            v425_state_conversion_audit.json
          if-no-files-found: ignore
          retention-days: 7
