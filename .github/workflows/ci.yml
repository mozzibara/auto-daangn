name: Daangn offline regression CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits should not run browsers/tests in parallel.
concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      # Offline unit tests use fixtures and mocks; browser binaries are only
      # required by the separate, explicitly approved live capture workflow.
      - name: Compile Python source
        run: python -m compileall -q .

      - name: Audit v4.26 canonical-only stock and transaction separation (offline)
        run: python -m scripts.audit_state_conversions_v425 --output v426_canonical_conversion_audit.json

      - name: Run offline regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -q 2>&1 | tee unittest.log

      - name: Publish offline CI summary (no artifact)
        if: success()
        shell: bash
        run: |
          echo "Offline tests passed on ${{ matrix.os }}; no browser launch, live data or network collection." >> "$GITHUB_STEP_SUMMARY"

  chrome-input-fixture:
    name: Real Chrome Stable input event fixture (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed Google Chrome Stable
        run: command -v google-chrome
      - name: Compare fill and sequential key event types on local HTML only
        run: python -m scripts.chrome_stable_input_compare
